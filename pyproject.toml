[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sipl-toolkit"
version = "0.1.0"
description = "SIPL Language Toolkit: grammar, typed AST, interpreter, CLI, and conformance suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vitalii Prykhodko" }]
dependencies = [
    "lark>=1.2.2",
    "pydantic>=2.9.0",
    "typer>=0.12.5",
]

[project.scripts]
sipl = "sipl.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pyyaml>=6.0.2",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sipl"]

[tool.hatch.build.targets.wheel.force-include]
"grammar/sipl.lark" = "sipl/grammar/sipl.lark"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sipl --cov-report=term-missing --cov-fail-under=80"