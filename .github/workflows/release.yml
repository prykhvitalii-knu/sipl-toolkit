name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  build-artifacts:
    name: Build Python & VS Code Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build Python package
        run: uv build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build VS Code VSIX
        working-directory: vscode-sipl
        run: |
          npm ci
          npm run compile
          npm run package

      - name: Collect release artifacts
        run: |
          mkdir -p release-assets
          cp dist/* release-assets/
          cp vscode-sipl/*.vsix release-assets/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/

  publish-pypi:
    name: Publish Python Package to PyPI
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Download Python dist
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/

      - name: Remove non-PyPI artifacts from dist
        run: rm -f dist/*.vsix

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    name: Create GitHub Release
    needs: [build-artifacts, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*