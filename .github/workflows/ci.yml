name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-core:
    name: Python Core (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Mypy strict type-check
        run: uv run mypy src

      - name: Run Pytest with coverage gate
        run: uv run pytest

      - name: Build Python wheel & sdist
        run: uv build

      - name: Verify clean wheel installation & Conformance Suite
        run: |
          uv venv /tmp/clean-env
          uv pip install --python /tmp/clean-env/bin/python dist/*.whl pytest pyyaml
          SIPL_CMD="/tmp/clean-env/bin/sipl" /tmp/clean-env/bin/pytest -o addopts="" tests/test_conformance.py

      - name: Upload Python dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  vscode-extension:
    name: VS Code Extension (Compile & Package VSIX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-sipl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-sipl/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: vscode-sipl/*.vsix